# --- Server ---
server.port=8080

# --- PostgreSQL ---
# Never commit real credentials - these read from environment variables with
# local-dev fallbacks so the app still runs out of the box.
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:hospital_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# 'validate' in prod (schema.sql / migrations own the schema); 'update' is fine for local dev.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- Connection pool (HikariCP) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# --- JWT ---
# Provide via environment variable in real deployments - this fallback is
# for local development only.
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-in-your-env-vars-never-commit-it}
jwt.expiration-ms=86400000

# --- Logging ---
logging.level.org.springframework.security=INFO
logging.level.com.hospital.hms=DEBUG
